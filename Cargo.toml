[package]
name = "topcoat-quiz"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.9.0", features = ["font-fontsource", "icon-iconify", "tailwind", "ui"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
topcoat = { version = "0.9.0", default-features = false, features = ["icon-iconify", "tailwind"] }
